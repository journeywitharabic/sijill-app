<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D3B2C">
<meta name="robots" content="noindex,nofollow">
<title>Sijill</title>
<!-- The label under a home-screen shortcut comes from the page title, and
     a teacher who is also a parent had the same words under two identical
     tiles. This one is the family page: plain Sijill, and the wordmark
     icon. The teacher app says "Sijill · Teacher" and carries the crest. -->
<link rel="icon" href="icon-192.png?v=4">
<!-- 180 is the size iOS actually wants, and ?v=2 gets past a cached copy of
     the old one. A shortcut already on a home screen keeps its picture until
     it is deleted and added again — nothing served from here can change it. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=4">
<link rel="stylesheet" href="sijill.css">
<style>
  /* `clip`, not `hidden`. They look identical, but overflow-x:hidden makes the
     element a scroll container, and that silently stopped position:sticky from
     working for the "3 of 8 still to go" counter — it scrolled away exactly as
     before while the CSS claimed otherwise. `overflow-x:clip` cuts off sideways
     overflow without creating a scroll container. */
  html,body{max-width:100%;overflow-x:clip}
  .wrap{max-width:560px}
  .loading{padding:40px;text-align:center;color:var(--ink-3)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line-2);
    border-top-color:var(--lapis);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .oops{max-width:440px;margin:40px auto;padding:0 18px;text-align:center}
  .oops h1{font-size:19px;margin:0 0 10px}
  .oops p{font-size:14px;color:var(--ink-2);line-height:1.6}
  .proto .rt button{min-height:34px;min-width:44px}
  /* The language and theme buttons used to sit in a bar pinned to the bottom
     of the window, which needed 64px of clearance under the last card. They
     now live in the page's own bar at the top, so this is just breathing room
     at the end of a long page. */
  body{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  /* see the note in index.html — Latin names inside Arabic sentences */
  .ctx h1, .kid, .rlist .tr{ unicode-bidi:plaintext; text-align:start; }
  .ctx .sub, .sess .d, .sess .w, .hero span{ unicode-bidi:isolate; }
</style>
</head>
